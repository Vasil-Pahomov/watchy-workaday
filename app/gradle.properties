# Machine-independent build settings only.
#
# Do NOT add org.gradle.java.home here. The JDK on PATH is too new for AGP and
# the working one is an absolute path that differs per machine — that is a
# per-developer setting for ~/.gradle/gradle.properties or JAVA_HOME.
# See docs/toolchain.md.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true

kotlin.code.style=official
