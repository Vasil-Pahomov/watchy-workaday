; ─────────────────────────────────────────────────────────────────────────────
;  Workaday — firmware for SQFMI Watchy v2.0 (ESP32-PICO-D4)
;
;  HARD CONSTRAINT: this project targets Watchy v2.0 only.
;  Do not add environments for v1.0 / v1.5 / v3.0 and do not introduce
;  hardware-revision #if branches. See CLAUDE.md.
;
;  Two environments:
;    watchy_v20  cross-compiled firmware for the device
;    native      host build of src/core/** + Unity unit tests (no hardware)
;
;  NOTE: `pio pkg install` rewrites this file and strips every comment. If you add
;  a dependency, edit lib_deps by hand.
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs = watchy_v20

; ── shared by every environment ──────────────────────────────────────────────
; Warnings live in `build_src_flags`, which applies to OUR sources only. Putting
; them in `build_flags` would lint the Arduino framework and Unity too, drowning
; real findings in third-party noise and making -Werror unusable.
[common]
build_flags =
    -std=gnu++17
    -I src

build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion          ; float math silently widened to double is slow on ESP32

; Known and expected: the device build emits exactly one warning, and it is not
; ours — GxEPD2_BW.h:662 shadows `byte`. It surfaces because board/display.cpp
; includes that header, so -Wshadow reaches it. Anything else is ours; fix it.
;
; That invariant is only true because third-party headers that do NOT compile
; clean under these flags are isolated at the include site with a
; `#pragma GCC diagnostic push/ignored/pop` — see the SensorLib include in
; src/board/accel.cpp and the NimBLE include in src/board/ble.cpp. Do the same for
; the next such header rather than dropping a flag: 28 identical warnings from a
; vendor header are how a real -Wdouble-promotion in our own float math gets
; scrolled past.

; ── device firmware ─────────────────────────────────────────────────────────
[env:watchy_v20]
platform  = espressif32@6.9.0   ; Arduino-ESP32 core 2.0.17. Pinned for reproducibility.
board     = watchy              ; PlatformIO manifest name for "SQFMI Watchy v2.0"
framework = arduino

build_unflags = -std=gnu++11
build_src_flags = ${common.build_src_flags}
build_flags =
    ${common.build_flags}
    ; The `watchy` board manifest only defines -DARDUINO_WATCHY, which is NOT
    ; revision-specific. Pin the revision here so the pin map cannot silently
    ; fall back to another board's defaults.
    -D ARDUINO_WATCHY_V20
    -D WORKADAY_TARGET_WATCHY_V20=1
    ; Silence the Arduino core's own logging: every log line costs CPU cycles,
    ; UART clock and wake time. Serial diagnostics are opt-in, see WORKADAY_DIAG.
    -D CORE_DEBUG_LEVEL=0
    -D WORKADAY_DIAG=0
    ; NimBLE's own logging, separately: the library reads CONFIG_NIMBLE_CPP_LOG_LEVEL
    ; rather than CORE_DEBUG_LEVEL, and left at its default it drags the format
    ; strings for the whole host stack into flash for output nobody reads.
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
    ; PROTOCOL.md §1: the watch is the peripheral and the server. It advertises in
    ; short windows, it never scans, and it never connects to anything. Compiling
    ; out the central and observer roles is that table expressed in the build
    ; rather than merely obeyed by the code. Measured: 13.3 KB of flash and 400
    ; bytes of RAM, for a role this firmware has no call for.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; One phone, one link at a time (§1 again). The default of 3 sizes the host's
    ; connection pool and the controller's for peers that cannot arrive.
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

board_build.partitions = partitions.csv

; Post-mortem support: a panic writes a core dump to flash instead of vanishing.
board_build.embed_txtfiles =

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 460800

lib_deps =
    zinggjm/GxEPD2@^1.6.2
    adafruit/Adafruit GFX Library@^1.11.11
    ; BMA423. Needed for one thing we cannot write ourselves: Bosch's ~6 KB feature
    ; -engine config blob, without which the hardware step counter does not exist.
    ; Steady-state step reads bypass this library entirely (see board/accel.cpp).
    lewisxhe/SensorLib@^0.4.1
    ; The BLE sync window (PROTOCOL.md). NimBLE rather than Bluedroid: roughly half
    ; the flash and ~100 KB less RAM for a peripheral role we use two
    ; characteristics of.
    ;
    ; The 1.4.x line is not a stale pin, it is the only one that builds here: 2.x
    ; requires arduino-esp32 3.x, and this project pins espressif32@6.9.0 (core
    ; 2.0.17). The caret stops at <2.0.0, so `pio pkg update` cannot walk us onto
    ; a version that will not compile. Moving to 2.x is a platform bump, not a
    ; library bump.
    h2zero/NimBLE-Arduino@^1.4.3

lib_ldf_mode = chain+

; Device-side tests are not part of the default loop — the host `native`
; environment is the gate. Keep hardware-in-the-loop tests opt-in.
test_ignore = *

; ── host unit tests ─────────────────────────────────────────────────────────
; Compiles ONLY src/core/** — that subtree must never include <Arduino.h>,
; which is exactly what makes it testable here.
[env:native]
platform       = native
test_framework = unity

; Link the project sources into each test binary. Without this PlatformIO builds
; the test files alone and every core:: symbol comes up undefined at link time.
test_build_src = yes

build_src_filter = -<*> +<core/>

build_flags =
    -std=c++17
    -O1
    -D WORKADAY_HOST_TEST=1
    -I src

build_src_flags =
    ${common.build_src_flags}
    -Werror                     ; strict on src/core/** — nothing third-party here
